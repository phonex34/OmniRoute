name: Build npm artifact (fork)

# Build npm tarball (.tgz) từ nhánh fork trên Linux x64 (native binary đúng
# platform), rồi gắn vào một GitHub Release có tag cố định `build-latest`.
# → Server wget link PUBLIC (repo public, không cần token):
#     https://github.com/phonex34/OmniRoute/releases/download/build-latest/omniroute.tgz
#
# Trigger: MANUAL ONLY. Actions tab → "Use workflow from" chọn branch → Run workflow.
# Để trống ô `ref` để build ĐÚNG branch đã chọn. Nếu điền `ref` thì nó ghi đè.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit để build. ĐỂ TRỐNG để build đúng branch đã chọn ở 'Use workflow from'."
        required: false
        default: ""
      clean:
        description: "Clean build — bỏ Next cache (bật khi nghi cache lỗi)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build tarball (linux/amd64, Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty input → checkout falls back to the ref selected in
          # "Use workflow from" (github.ref). A non-empty input overrides it.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve built commit
        id: sha
        run: |
          set -euo pipefail
          FULL=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Building from commit $SHORT ($FULL) on ref '${{ github.event.inputs.ref || github.ref }}'"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps --prefer-offline

      - name: Cache Next build
        if: ${{ github.event.inputs.clean != 'true' }}
        uses: actions/cache@v4
        with:
          path: .build/next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ steps.sha.outputs.short }}
          restore-keys: next-

      - name: Build + pack
        env:
          OMNIROUTE_SKIP_DOCS: "1"
          OMNIROUTE_USE_TURBOPACK: "0"
          OMNIROUTE_MITM_STUB: "1"
          # next build (webpack production pass) peaks ~3.9 GB and OOM'd at the old
          # 4096 ceiling — build-next-isolated.mjs wants 8 GB by default but RESPECTS an
          # existing --max-old-space-size, so a low value here caps the spawned child too.
          # ubuntu-latest has ~16 GB, so 8192 is safe. (#6409: this only bounds V8 heap,
          # not Turbopack native mem — OMNIROUTE_USE_TURBOPACK=0 above keeps us on webpack.)
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.clean }}" = "true" ]; then
            echo "Clean build — xóa .build trước khi build"
            rm -rf .build
          fi
          npm run build:release
          FILE=$(npm pack --silent)
          mv "$FILE" omniroute.tgz
          echo "Packed omniroute.tgz ($(du -h omniroute.tgz | cut -f1)) from $FILE"

      - name: Verify tarball matches built commit
        run: |
          set -euo pipefail
          PACKED_SHA=$(tar xzO -f omniroute.tgz package/dist/BUILD_SHA 2>/dev/null || true)
          echo "Tarball BUILD_SHA=[$PACKED_SHA] expected=[${{ steps.sha.outputs.short }}]"
          if [ "$PACKED_SHA" != "${{ steps.sha.outputs.short }}" ]; then
            echo "::error::Tarball BUILD_SHA ($PACKED_SHA) != built commit (${{ steps.sha.outputs.short }}). Aborting release."
            exit 1
          fi

      # Per-commit release: keeps history (one release per commit SHA) so older
      # builds stay downloadable and each release URL maps 1:1 to a commit.
      - name: Publish per-commit Release (tag build-${{ steps.sha.outputs.short }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          target_commitish: ${{ steps.sha.outputs.full }}
          name: "OmniRoute fork build ${{ steps.sha.outputs.short }}"
          body: "Built from `${{ github.event.inputs.ref || github.ref }}` at commit `${{ steps.sha.outputs.full }}`"
          files: omniroute.tgz
          make_latest: "false"

      # Stable pointer: server wget URL stays constant at build-latest/omniroute.tgz.
      - name: Update stable Release (tag build-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          target_commitish: ${{ steps.sha.outputs.full }}
          name: "OmniRoute fork build (latest → ${{ steps.sha.outputs.short }})"
          body: "Built from `${{ github.event.inputs.ref || github.ref }}` at commit `${{ steps.sha.outputs.full }}`"
          files: omniroute.tgz
          make_latest: "true"
